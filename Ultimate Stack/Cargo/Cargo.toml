// ============================================================
// 3. FFI HANDLE
// ============================================================

#[repr(C)]
pub enum DVSM_Handle {} // opaque ABI

#[repr(C)]
#[derive(Copy, Clone)]
pub struct DVSM_Params {
    pub dt: f32,
    pub alpha: f32,
    pub lambda: f32,
    pub u_max: f32,
    pub r: u32,
}

#[repr(C)]
#[derive(Copy, Clone)]
pub struct DVSM_TraceFrame {
    pub frame: u64,
    pub stress: f32,
    pub novelty: f32,
    pub drift: f32,
    pub entropy: f32,
    pub energy: f32,
    pub ghost: u8,
    pub contained: u8,
}

// ============================================================
// 4. CORE STATE
// ============================================================

const RMAX: usize = 16;

pub struct Core {
    z: [f32; RMAX],
    s: [f32; RMAX],
    w: [f32; RMAX * RMAX],
    v: [f32; RMAX],
    x: [f32; RMAX],
    frame: u64,
    r: usize,
    alive: bool,
    kill_count: u32,
}

fn dot(a: &[f32], b: &[f32], n: usize) -> f32 {
    let mut s = 0.0;
    for i in 0..n { s += a[i] * b[i]; }
    s
}

fn norm2(a: &[f32], n: usize) -> f32 {
    dot(a, a, n)
}

fn contain(z: &mut [f32], r: usize, u: f32) -> bool {
    let e = norm2(z, r);
    if e > u * u || !e.is_finite() {
        for i in 0..r { z[i] = 0.0; }
        return true;
    }
    false
}

fn rebirth(c: &mut Core) {
    c.z = [0.0; RMAX];
    c.s = [0.0; RMAX];
    c.v = [0.0; RMAX];
    c.x = [0.0; RMAX];
    c.kill_count = 0;
    c.alive = true;
}

// ============================================================
// 5. CORE STEP
// ============================================================

impl Core {
    fn step(&mut self, input: &[f32], p: &DVSM_Params) -> DVSM_TraceFrame {
        let r = self.r.min(input.len());

        let killed = contain(&mut self.z, r, p.u_max);
        if killed { self.kill_count += 1; } else { self.kill_count = 0; }

        if !self.alive || self.kill_count >= 3 {
            self.alive = false;
            rebirth(self);
        }

        // projection
        let mut c = [0.0f32; RMAX];
        let mut pvec = [0.0f32; RMAX];
        let mut res = [0.0f32; RMAX];

        for k in 0..r {
            c[k] = dot(&self.w[k * RMAX..], input, r);
        }

        for i in 0..r {
            for k in 0..r {
                pvec[i] += self.w[k * RMAX + i] * c[k];
            }
        }

        for i in 0..r {
            res[i] = input[i] - pvec[i];
        }

        let r2 = norm2(&res, r);

        // evolution
        for k in 0..r {
            let mut acc = 0.0;
            for j in 0..r {
                if j != k {
                    let kappa = (k as f32 * 1.37 - j as f32 * 1.73).sin();
                    acc += (self.z[k] * self.s[j] - self.z[j] * self.s[k]) * kappa;
                }
            }
            self.z[k] += p.dt * (acc - p.lambda * self.z[k]);
        }

        if self.alive {
            for k in 0..r {
                self.s[k] = p.alpha * self.s[k] + (1.0 - p.alpha) * self.z[k];
            }
        }

        for i in 0..r {
            self.v[i] = self.v[i] * 0.98 + (res[i] + self.s[i]) * 0.01;
            self.v[i] = self.v[i].clamp(-p.u_max, p.u_max);
            self.x[i] += self.v[i] * p.dt;
        }

        self.frame += 1;

        DVSM_TraceFrame {
            frame: self.frame,
            stress: 0.0,
            novelty: r2.sqrt(),
            drift: 0.0,
            entropy: norm2(&self.z, r).ln().max(0.0),
            energy: norm2(&self.z, r).sqrt(),
            ghost: DVSM_NOMINAL,
            contained: killed as u8,
        }
    }
}

// ============================================================
// 6. GLOBAL STATE
// ============================================================

static mut CORE: Option<Core> = None;

// ============================================================
// 7. C ABI
// ============================================================

#[no_mangle]
pub extern "C" fn dvsm_init(_n: u32, r: u32) -> *mut DVSM_Handle {
    unsafe {
        CORE = Some(Core {
            z: [0.0; RMAX],
            s: [0.0; RMAX],
            w: [0.0; RMAX * RMAX],
            v: [0.0; RMAX],
            x: [0.0; RMAX],
            frame: 0,
            r: r as usize,
            alive: true,
            kill_count: 0,
        });
    }
    core::ptr::null_mut()
}

#[no_mangle]
pub unsafe extern "C" fn dvsm_step(
    _h: *mut DVSM_Handle,
    input: *const f32,
    len: u32,
    out: *mut DVSM_TraceFrame,
) -> i32 {
    if input.is_null() || out.is_null() { return -1; }

    let core = CORE.as_mut().unwrap();
    let input = core::slice::from_raw_parts(input, len as usize);

    let p = DVSM_Params {
        dt: 0.004166,
        alpha: 0.98,
        lambda: 0.05,
        u_max: 100.0,
        r: core.r as u32,
    };

    *out = core.step(input, &p);
    0
}

#[no_mangle]
pub extern "C" fn dvsm_free(_h: *mut DVSM_Handle) {
    unsafe { CORE = None; }
}
