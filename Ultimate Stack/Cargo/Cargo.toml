# Cargo.toml

[package]
name = "dvsm_core"
version = "1.0.0"
edition = "2021"
authors = ["Daniel J. Dillberg"]
description = "DVSM-π+++ / DQSDv2 Spectral Arbitration Kernel"
license = "MIT"

[lib]
name = "dvsm_core"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
overflow-checks = false

[features]
default = []
deterministic = []

[dependencies]
