#ifndef DVSM_H
#define DVSM_H

#include <stdint.h>

#ifdef __cplusplus
extern "C" {
#endif

/* ── Ghost modes (diagnostic only, never fed back) ────────── */
enum DvsmGhost {
    DVSM_GHOST_NOMINAL  = 0,
    DVSM_GHOST_COLLAPSE = 1,
    DVSM_GHOST_DIFFUSE  = 2,
    DVSM_GHOST_ECHO     = 3,
    DVSM_GHOST_BURST    = 4,
    DVSM_GHOST_TRAP     = 5,
    DVSM_GHOST_VACUUM   = 6,
};

/* ── Step result (read-only diagnostics) ──────────────────── */
typedef struct {
    float    stress;      /* B(t) = ||S||/(||Z||+eps)        */
    float    novelty;     /* ||residual||/||input||           */
    float    drift;       /* ||W^TW - I||_F                  */
    float    entropy;     /* spectral entropy                 */
    float    energy;      /* ||Z||                            */
    uint8_t  ghost;       /* DvsmGhost enum value             */
    uint8_t  contained;   /* 1 if containment fired this step */
} DvsmStepResult;

/* ── Trace entry (minimal export schema) ──────────────────── */
typedef struct {
    uint64_t frame;
    float    stress;
    float    novelty;
    float    drift;
    float    entropy;
    float    energy;
    uint8_t  ghost;
    uint8_t  contained;
} DvsmTraceEntry;

/* ── Opaque core handle ───────────────────────────────────── */
typedef struct DvsmCore DvsmCore;

/* ── API surface (4 functions, stable ABI) ────────────────── */

/* Initialize engine. Returns opaque handle. */
DvsmCore* dvsm_init(uint32_t n, uint32_t r);

/* Process one frame. Returns 0 on success, <0 on error. */
int32_t dvsm_step(
    DvsmCore*        core,
    const float*     input,
    uint32_t         input_len,
    DvsmStepResult*  result    /* out, nullable */
);

/* Query vacuum state. Returns 1 if in vacuum. */
uint8_t dvsm_is_vacuum(const DvsmCore* core);

/* Export trace entry for current frame. Returns 0 on success. */
int32_t dvsm_get_trace(
    const DvsmCore*        core,
    const DvsmStepResult*  result,
    DvsmTraceEntry*        entry   /* out */
);

/* Free engine. */
void dvsm_free(DvsmCore* core);

#ifdef __cplusplus
}
#endif

#endif /* DVSM_H */
