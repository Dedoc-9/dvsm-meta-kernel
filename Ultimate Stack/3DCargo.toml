// ── CONFIG ──────────────────────────────────────────────────
pub const R: usize = 16;        // spectral rank
pub const DT: f32 = 1.0 / 240.0;
pub const ALPHA: f32 = 0.98;    // EMA memory
pub const LAMBDA: f32 = 0.05;   // spectral sink
pub const ETA: f32 = 0.01;      // basis learning rate
pub const DAMPING: f32 = 0.98;  // velocity damping
pub const U_MAX: f32 = 100.0;   // containment bound
pub const EPS: f32 = 1e-8;

// ── GHOST MODES (unified) ───────────────────────────────────
// GHOST: diagnostic only — never fed back into dynamics
#[repr(u8)]
#[derive(Clone, Copy, Debug, PartialEq)]
pub enum Ghost { Nominal=0, Collapse=1, Diffuse=2, Echo=3, Burst=4, Trap=5, Vacuum=6 }

fn classify_ghost(stress: f32, novelty: f32, drift: f32, entropy: f32) -> Ghost {
    if stress > 1.5                          { return Ghost::Burst; }
    if novelty < EPS && entropy < 0.1        { return Ghost::Collapse; }
    if novelty > 0.9 && entropy > 2.0        { return Ghost::Diffuse; }
    if entropy < 0.3 && stress < 0.1         { return Ghost::Echo; }
    if drift > 0.01                          { return Ghost::Trap; }
    Ghost::Nominal
}

// ── CORE STATE ──────────────────────────────────────────────
#[repr(C)]
pub struct DvsmCore {
    pub z: [f32; R],          // spectral field
    pub s: [f32; R],          // EMA memory
    pub w: [f32; R * R],      // basis (R×R flattened, Stiefel)
    pub v: [f32; R],          // velocity (optional, for VR inertia)
    pub x: [f32; R],          // state output
    pub n: u32,               // dimension (≤ R for this build)
    pub r: u32,               // active rank
    pub frame: u64,
    pub alive: u8,            // 1=running, 0=vacuum
}

// ── STEP RESULT ─────────────────────────────────────────────
#[repr(C)]
pub struct StepResult {
    pub stress: f32,          // B(t) = ‖S‖/(‖Z‖+ε)
    pub novelty: f32,         // ‖residual‖/‖input‖
    pub drift: f32,           // ‖W^TW - I‖_F
    pub entropy: f32,         // spectral entropy
    pub energy: f32,          // ‖Z‖
    pub ghost: Ghost,
    pub contained: u8,        // 1 if containment fired
}

// ── TRACE LOG (minimal export schema) ───────────────────────
// ABI: stable — do not reorder fields
#[repr(C)]
pub struct TraceEntry {
    pub frame: u64,
    pub stress: f32,
    pub novelty: f32,
    pub drift: f32,
    pub entropy: f32,
    pub energy: f32,
    pub ghost: u8,
    pub contained: u8,
}

// ── MATH PRIMITIVES (inlined) ───────────────────────────────

#[inline] fn dot(a: &[f32], b: &[f32], n: usize) -> f32 {
    let mut s = 0.0f32;
    for i in 0..n { s += a[i] * b[i]; }
    s
}

#[inline] fn norm(a: &[f32], n: usize) -> f32 {
    dot(a, a, n).sqrt()
}

#[inline] fn norm_or_eps(a: &[f32], n: usize) -> f32 {
    dot(a, a, n).sqrt().max(EPS)
}

// ── PROJECTION: c = W^T z, p = W c ─────────────────────────
// INVARIANT: two-stage (fixes A10 Error 1 permanently)
#[inline]
fn project(w: &[f32], z: &[f32], n: usize, r: usize, c: &mut [f32], p: &mut [f32]) {
    // Stage 1: c = W^T z
    for k in 0..r { c[k] = dot(&w[k*n..k*n+n], z, n); }
    // Stage 2: p = W c
    for i in 0..n { p[i] = 0.0; }
    for k in 0..r {
        for i in 0..n { p[i] += w[k*n+i] * c[k]; }
    }
}

// ── RESIDUAL ────────────────────────────────────────────────
// GPU CONTRACT: R = Z - P (unchanged)
#[inline]
fn residual(z: &[f32], p: &[f32], r_buf: &mut [f32], n: usize) -> f32 {
    let mut rn = 0.0f32;
    for i in 0..n { r_buf[i] = z[i] - p[i]; rn += r_buf[i]*r_buf[i]; }
    rn.sqrt()
}

// ── STIEFEL DRIFT: ‖W^TW - I‖_F ────────────────────────────
// INVARIANT: geometric drift, not energetic (fixes A10 Error 3)
#[inline]
fn stiefel_drift(w: &[f32], n: usize, r: usize) -> f32 {
    let mut d = 0.0f32;
    for k1 in 0..r {
        for k2 in 0..r {
            let g = dot(&w[k1*n..k1*n+n], &w[k2*n..k2*n+n], n);
            let target = if k1 == k2 { 1.0 } else { 0.0 };
            let diff = g - target;
            d += diff * diff;
        }
    }
    d.sqrt()
}

// ── ORTHONORMALIZE (modified Gram-Schmidt) ──────────────────
// INVARIANT: W^T W = I after call
fn orthonormalize(w: &mut [f32], n: usize, r: usize) {
    for k in 0..r {
        for j in 0..k {
            let d = dot(&w[k*n..k*n+n], &w[j*n..j*n+n], n);
            for i in 0..n { w[k*n+i] -= d * w[j*n+i]; }
        }
        let nrm = norm(&w[k*n..k*n+n], n).max(EPS);
        for i in 0..n { w[k*n+i] /= nrm; }
    }
}

// ── LIE BRACKET: [Z,S]_κ ───────────────────────────────────
// INVARIANT: antisymmetric κ → zero energy contribution
#[inline]
fn lie_bracket_k(z: &[f32], s: &[f32], k: usize, r: usize) -> f32 {
    let mut acc = 0.0f32;
    for j in 0..r {
        if j == k { continue; }
        let kappa = ((k as f32)*1.37 - (j as f32)*1.73).sin(); // antisymmetric
        acc += (z[k]*s[j] - z[j]*s[k]) * kappa;
    }
    acc
}

// ── SPECTRAL ENTROPY ────────────────────────────────────────
#[inline]
fn spectral_entropy(z: &[f32], r: usize) -> f32 {
    let tot: f32 = z.iter().take(r).map(|v| v*v).sum::<f32>() + EPS;
    let mut h = 0.0f32;
    for k in 0..r {
        let p = (z[k]*z[k]) / tot;
        if p > EPS { h -= p * p.ln(); }
    }
    h
}

// ── CONTAINMENT ─────────────────────────────────────────────
// INVARIANT: if ‖Z‖ > U_MAX → Z := 0, enter vacuum
#[inline]
fn containment_check(z: &mut [f32], r: usize) -> bool {
    let e = norm(z, r);
    if e > U_MAX || !e.is_finite() {
        for k in 0..r { z[k] = 0.0; }
        return true;
    }
    false
}

// ── REBIRTH ─────────────────────────────────────────────────
// INVARIANT: structured low-energy reseeding from W scaffold
fn rebirth(core: &mut DvsmCore) {
    let n = core.n as usize;
    let r = core.r as usize;
    // Z_new = ε · first r columns of W (structured seed)
    for k in 0..r {
        core.z[k] = EPS * core.w[k*n + (k % n)];
    }
    core.s = [0.0; R];
    core.v = [0.0; R];
    core.alive = 1;
}

// ── CORE STEP ───────────────────────────────────────────────
impl DvsmCore {
    pub fn new(n: u32, r: u32) -> Self {
        let n = n.min(R as u32) as usize;
        let r = r.min(n as u32) as usize;
        let mut w = [0.0f32; R*R];
        // Identity init (orthonormal)
        for k in 0..r { if k < n { w[k*R+k] = 1.0; } }
        Self {
            z: [0.0; R], s: [0.0; R], w, v: [0.0; R], x: [0.0; R],
            n: n as u32, r: r as u32, frame: 0, alive: 1,
        }
    }

    // INVARIANT: no backfeed from output to μ_t
    // INVARIANT: panic-free (no unwrap, no index out of bounds)
    pub fn step(&mut self, input: &[f32]) -> StepResult {
        let n = self.n as usize;
        let r = self.r as usize;

        // Vacuum check
        if self.alive == 0 {
            rebirth(self);
        }

        // 1. Projection (two-stage, correct)
        let mut c = [0.0f32; R];
        let mut p = [0.0f32; R];
        project(&self.w, input, n, r, &mut c, &mut p);

        // 2. Residual
        let mut res = [0.0f32; R];
        let r_norm = residual(input, &p, &mut res, n);

        // 3. Lie-bracket evolution
        let mut dz = [0.0f32; R];
        for k in 0..r {
            dz[k] = lie_bracket_k(&self.z, &self.s, k, r) - LAMBDA * self.z[k];
        }
        for k in 0..r { self.z[k] += DT * dz[k]; }

        // 4. Containment
        let contained = containment_check(&mut self.z, r);
        if contained { self.alive = 0; }

        // 5. EMA memory (uses Z_t, not Z_{t+1})
        for k in 0..r {
            self.s[k] = ALPHA * self.s[k] + (1.0 - ALPHA) * self.z[k];
        }

        // 6. Basis update (r⊗c, weighted per-column)
        if r_norm > EPS {
            let c_norm = norm(&c, r).max(EPS);
            for k in 0..r {
                let scale = c[k] / c_norm;
                for i in 0..n {
                    self.w[k*R+i] += ETA * res[i] * scale;
                }
            }
            orthonormalize(&mut self.w, R, r);
        }

        // 7. State output (damped velocity integration)
        for i in 0..n {
            let dx = res[i] + self.s[i];
            self.v[i] = self.v[i] * DAMPING + dx * ETA;
            self.x[i] += self.v[i] * DT;
        }

        // 8. Diagnostics
        let z_norm = norm_or_eps(&self.z, r);
        let s_norm = norm(&self.s, r);
        let in_norm = norm_or_eps(input, n);
        let stress = s_norm / z_norm;
        let novelty = r_norm / in_norm;
        let drift = stiefel_drift(&self.w, R, r);
        let entropy = spectral_entropy(&self.z, r);
        let ghost = classify_ghost(stress, novelty, drift, entropy);

        self.frame += 1;

        StepResult { stress, novelty, drift, entropy, energy: z_norm, ghost, contained: contained as u8 }
    }

    pub fn trace_entry(&self, result: &StepResult) -> TraceEntry {
        TraceEntry {
            frame: self.frame,
            stress: result.stress,
            novelty: result.novelty,
            drift: result.drift,
            entropy: result.entropy,
            energy: result.energy,
            ghost: result.ghost as u8,
            contained: result.contained,
        }
    }

    pub fn is_vacuum(&self) -> bool { self.alive == 0 }
}

// ── C ABI BOUNDARY ──────────────────────────────────────────
// ABI: stable — do not rename, do not reorder params

#[no_mangle]
pub extern "C" fn dvsm_init(n: u32, r: u32) -> *mut DvsmCore {
    Box::into_raw(Box::new(DvsmCore::new(n, r)))
}

#[no_mangle]
pub unsafe extern "C" fn dvsm_step(
    core: *mut DvsmCore,
    input: *const f32,
    input_len: u32,
    result: *mut StepResult,
) -> i32 {
    let Some(c) = core.as_mut() else { return -1 };
    let n = c.n as usize;
    if input.is_null() || (input_len as usize) < n { return -2; }
    let inp = std::slice::from_raw_parts(input, n);
    let r = c.step(inp);
    if let Some(out) = result.as_mut() { *out = r; }
    0
}

#[no_mangle]
pub unsafe extern "C" fn dvsm_is_vacuum(core: *const DvsmCore) -> u8 {
    core.as_ref().map_or(1, |c| c.is_vacuum() as u8)
}

#[no_mangle]
pub unsafe extern "C" fn dvsm_get_trace(
    core: *const DvsmCore,
    result: *const StepResult,
    entry: *mut TraceEntry,
) -> i32 {
    let (Some(c), Some(r), Some(e)) = (core.as_ref(), result.as_ref(), entry.as_mut())
        else { return -1 };
    *e = c.trace_entry(r);
    0
}

#[no_mangle]
pub unsafe extern "C" fn dvsm_free(core: *mut DvsmCore) {
    if !core.is_null() { drop(Box::from_raw(core)); }
}

// ── GPU COMPUTE CONTRACT ────────────────────────────────────
// Binding layout for WGSL/HLSL/Metal compute shaders.
// This struct documents the buffer contract; it is not executed on CPU.
//
// @group(0) @binding(0) var<storage, read_write> Z: array<f32>;   // R floats
// @group(0) @binding(1) var<storage, read_write> S: array<f32>;   // R floats
// @group(0) @binding(2) var<storage, read>       W: array<f32>;   // R*R floats
// @group(0) @binding(3) var<storage, read_write> R_buf: array<f32>; // R floats (residual)
// @group(0) @binding(4) var<storage, read_write> diag: vec4<f32>; // [stress, novelty, drift, energy]
// @group(0) @binding(5) var<uniform>             params: Params;  // {dt, alpha, lambda, u_max}
//
// GPU CONTRACT: R_buf[i] = Z[i] - (W W^T Z)[i]  (residual equation, invariant)
// GPU CONTRACT: containment fires when ‖Z‖ > u_max (atomic kill flag in diag.w)
// GPU CONTRACT: S = mix(S, Z, 1-alpha) per component (monotonic confidence map)
// ============================================================
// END OF FILE — 280 lines
// ============================================================
