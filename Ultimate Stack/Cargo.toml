// ============================================================================
// DVSM VULKAN COMPUTE SHADER (selection kernel)
// ============================================================================

#version 450

layout(local_size_x = 64) in;

layout(set = 0, binding = 0) buffer ZBuffer {
    float z[];
};

layout(set = 0, binding = 1) buffer SBuffer {
    float s[];
};

layout(set = 0, binding = 2) buffer OutBuffer {
    float ghost[];
};

uniform float beta;
uniform float epsilon;
uniform float u_max;

void main() {

    uint i = gl_GlobalInvocationID.x;

    float diff = z[i] - s[i];
    float residue = diff * diff;

    float g = residue * beta;

    float z_norm = sqrt(residue);

    float alive = (g > epsilon && z_norm < u_max) ? 1.0 : 0.0;

    ghost[i] = alive * g;
}

// ============================================================================
// DVSM METAL COMPUTE KERNEL
// ============================================================================

#include <metal_stdlib>
using namespace metal;

kernel void dvsm_kernel(
    device float* z        [[buffer(0)]],
    device float* s        [[buffer(1)]],
    device float* ghost    [[buffer(2)]],
    constant float& beta   [[buffer(3)]],
    constant float& eps    [[buffer(4)]],
    constant float& umax   [[buffer(5)]],
    uint id [[thread_position_in_grid]]
) {
    float diff = z[id] - s[id];
    float residue = diff * diff;

    float g = residue * beta;
    float z_norm = sqrt(residue);

    ghost[id] = (g > eps && z_norm < umax) ? g : 0.0;
}

// ============================================================================
// DVSM DLSS ADAPTER LAYER (FRAME RECONSTRUCTION SHIM)
// ============================================================================

pub struct DVSLAdapter;

impl DVSLAdapter {

    /// Input: motion-aligned ghost field
    /// Output: frame confidence weight (DLSS-style)
    #[inline(always)]
    pub fn confidence(ghost: f32, motion_vector_error: f32) -> f32 {
        let stability = 1.0 / (1.0 + motion_vector_error);
        ghost * stability
    }

    /// Frame acceptance (DLSS replacement gate)
    #[inline(always)]
    pub fn accept_frame(conf: f32, threshold: f32) -> bool {
        conf > threshold
    }

    /// Temporal blend factor (reconstruction weight)
    #[inline(always)]
    pub fn blend(conf: f32) -> f32 {
        conf.clamp(0.0, 1.0)
    }
}

