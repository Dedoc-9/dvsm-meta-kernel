#include "DVSMRuntime.h"

extern "C" {
    void* dvsm_create(void*);
    void dvsm_destroy(void*);
    unsigned int dvsm_step(void*, unsigned int);
    float dvsm_residue(const float*, const float*, unsigned int);
    unsigned int dvsm_gate(float, float, float, float, float);
}

static void* Handle = nullptr;

void UDvsmRuntime::Init(float beta, float epsilon, float u_max)
{
    struct {
        float beta;
        float epsilon;
        float u_max;
    } params = { beta, epsilon, u_max };

    Handle = dvsm_create(&params);
}

void UDvsmRuntime::Step(int32 sigma)
{
    if (!Handle) return;
    dvsm_step(Handle, (unsigned int)sigma);
}

float UDvsmRuntime::Residue(const TArray<float>& A, const TArray<float>& B)
{
    if (A.Num() == 0 || B.Num() == 0) return 0.0f;

    return dvsm_residue(A.GetData(), B.GetData(), A.Num());
}

bool UDvsmRuntime::Gate(float ghost, float beta, float epsilon, float u_max, float z_norm)
{
    return dvsm_gate(ghost, beta, epsilon, u_max, z_norm) != 0;
}

