pub const DVSM_NOMINAL:  u8 = 0;
pub const DVSM_COLLAPSE: u8 = 1;
pub const DVSM_DIFFUSE:  u8 = 2;
pub const DVSM_ECHO:     u8 = 3;
pub const DVSM_BURST:    u8 = 4;
pub const DVSM_TRAP:     u8 = 5;
pub const DVSM_VACUUM:   u8 = 6;

// ============================================================
// 3. OPAQUE HANDLE (FFI SAFE)
// ============================================================

#[repr(C)]
pub enum DVSM_Handle {} // uninhabited ABI handle

// ============================================================
// 4. PARAM / TRACE STRUCTS
// ============================================================

#[repr(C)]
#[derive(Copy, Clone)]
pub struct DVSM_Params {
    pub dt: f32,
    pub alpha: f32,
    pub lambda: f32,
    pub u_max: f32,
    pub r: u32,
}

#[repr(C)]
#[derive(Copy, Clone)]
pub struct DVSM_TraceFrame {
    pub frame: u64,
    pub stress: f32,
    pub novelty: f32,
    pub drift: f32,
    pub entropy: f32,
    pub energy: f32,
    pub ghost: u8,
    pub contained: u8,
}

// ============================================================
// 5. INTERNAL CORE STATE
// ============================================================

const RMAX: usize = 16;

#[repr(C)]
pub struct Core {
    z: [f32; RMAX],
    s: [f32; RMAX],
    w: [f32; RMAX * RMAX],
    v: [f32; RMAX],
    x: [f32; RMAX],

    w_prev: [f32; RMAX * RMAX],

    frame: u64,
    r: usize,
    alive: bool,
    kill_count: u32,
    frames_since_rebirth: u32,
}

// ============================================================
// 6. CORE HELPERS
// ============================================================

#[inline(always)]
fn dot(a: &[f32], b: &[f32], n: usize) -> f32 {
    let mut s = 0.0;
    for i in 0..n { s += a[i] * b[i]; }
    s
}

#[inline(always)]
fn norm2(a: &[f32], n: usize) -> f32 {
    dot(a, a, n)
}

// ============================================================
// 7. CONTAINMENT
// ============================================================

#[inline(always)]
fn contain(z: &mut [f32], r: usize, u_max: f32) -> bool {
    let e2 = norm2(z, r);
    if e2 > u_max * u_max || !e2.is_finite() {
        for i in 0..r { z[i] = 0.0; }
        return true;
    }
    false
}

// ============================================================
// 8. REBIRTH
// ============================================================

fn rebirth(c: &mut Core) {
    c.z = [0.0; RMAX];
    c.s = [0.0; RMAX];
    c.v = [0.0; RMAX];
    c.x = [0.0; RMAX];

    c.kill_count = 0;
    c.frames_since_rebirth = 0;
    c.alive = true;
}

// ============================================================
// 9. CORE STEP (ORDER-CORRECTED HARDENED VERSION)
// ============================================================

impl Core {
    fn step(&mut self, input: &[f32], p: &DVSM_Params) -> DVSM_TraceFrame {
        let r = self.r.min(input.len());

        // ---- H2: hysteresis ----
        let killed = contain(&mut self.z, r, p.u_max);
        if killed {
            self.kill_count += 1;
        } else {
            self.kill_count = 0;
        }

        if !self.alive || self.kill_count >= 3 {
            self.alive = false;
            rebirth(self);
        }

        self.frames_since_rebirth += 1;

        // ====================================================
        // PROJECTION (E1/E2 FIX: MUST BE FIRST)
        // ====================================================

        let mut c = [0.0f32; RMAX];
        let mut pvec = [0.0f32; RMAX];
        let mut res = [0.0f32; RMAX];

        for k in 0..r {
            c[k] = dot(&self.w[k * RMAX..], input, r);
        }

        for i in 0..r {
            for k in 0..r {
                pvec[i] += self.w[k * RMAX + i] * c[k];
            }
        }

        for i in 0..r {
            res[i] = input[i] - pvec[i];
        }

        let r_norm2 = norm2(&res, r);

        // ====================================================
        // LIE-BRACKET EVOLUTION
        // ====================================================

        for k in 0..r {
            let mut acc = 0.0;
            for j in 0..r {
                if j == k { continue; }
                let kappa = (k as f32 * 1.37 - j as f32 * 1.73).sin();
                acc += (self.z[k] * self.s[j] - self.z[j] * self.s[k]) * kappa;
            }
            self.z[k] += p.dt * (acc - p.lambda * self.z[k]);
        }

        // ====================================================
        // EMA (H4: freeze on vacuum)
        // ====================================================

        if self.alive {
            for k in 0..r {
                self.s[k] = p.alpha * self.s[k] + (1.0 - p.alpha) * self.z[k];
            }
        }

        // ====================================================
        // BIAS + VELOCITY
        // ====================================================

        for i in 0..r {
            self.v[i] = self.v[i] * 0.98 + (res[i] + self.s[i]) * 0.01;
            self.v[i] = self.v[i].clamp(-p.u_max, p.u_max); // H7
            self.x[i] += self.v[i] * p.dt;
        }

        // ====================================================
        // BASIS UPDATE
        // ====================================================

        if r_norm2 > 1e-8 {
            let cn = norm2(&c, r).sqrt().max(1e-8);
            for k in 0..r {
                let sc = c[k] / cn;
                for i in 0..r {
                    self.w[k * RMAX + i] += 0.01 * res[i] * sc;
                }
            }
        }

        // ====================================================
        // ORTHONORMALIZE (light MGS)
        // ====================================================

        for k in 0..r {
            for j in 0..k {
                let d = dot(
                    &self.w[k * RMAX..],
                    &self.w[j * RMAX..],
                    r
                );
                for i in 0..r {
                    self.w[k * RMAX + i] -= d * self.w[j * RMAX + i];
                }
            }
        }

        // ====================================================
        // STATS
        // ====================================================

        let z2 = norm2(&self.z, r);
        let s2 = norm2(&self.s, r);

        let stress = (s2.sqrt() / (z2.sqrt() + 1e-8)).max(0.0);
        let novelty = r_norm2.sqrt();

        let drift = 0.0; // placeholder (GPU or extended version)
        let entropy = z2.ln().max(0.0);
        let energy = z2.sqrt();

        let ghost =
            if !stress.is_finite() { DVSM_BURST }
            else if energy < 1e-6 { DVSM_COLLAPSE }
            else { DVSM_NOMINAL };

        self.frame += 1;

        DVSM_TraceFrame {
            frame: self.frame,
            stress,
            novelty,
            drift,
            entropy,
            energy,
            ghost,
            contained: killed as u8,
        }
    }
}

// ============================================================
// 10. GLOBAL INSTANCE (SINGLE HANDLE MODEL)
// ============================================================

static mut CORE: Option<Core> = None;

// ============================================================
// 11. C ABI
// ============================================================

#[no_mangle]
pub extern "C" fn dvsm_init(n: u32, r: u32) -> *mut DVSM_Handle {
    unsafe {
        CORE = Some(Core {
            z: [0.0; RMAX],
            s: [0.0; RMAX],
            w: [0.0; RMAX * RMAX],
            w_prev: [0.0; RMAX * RMAX],
            v: [0.0; RMAX],
            x: [0.0; RMAX],
            frame: 0,
            r: r as usize,
            alive: true,
            kill_count: 0,
            frames_since_rebirth: 0,
        });
    }
    core::ptr::null_mut()
}

#[no_mangle]
pub unsafe extern "C" fn dvsm_step(
    _h: *mut DVSM_Handle,
    input: *const f32,
    len: u32,
    out: *mut DVSM_TraceFrame,
) -> i32 {
    if input.is_null() || out.is_null() { return -1; }

    let core = CORE.as_mut().unwrap();
    let input = core::slice::from_raw_parts(input, len as usize);

    let p = DVSM_Params {
        dt: 0.004166,
        alpha: 0.98,
        lambda: 0.05,
        u_max: 100.0,
        r: core.r as u32,
    };

    let frame = core.step(input, &p);
    *out = frame;

    0
}

#[no_mangle]
pub unsafe extern "C" fn dvsm_is_vacuum(_h: *const DVSM_Handle) -> u8 {
    CORE.as_ref().map_or(1, |c| (!c.alive) as u8)
}

#[no_mangle]
pub unsafe extern "C" fn dvsm_free(_h: *mut DVSM_Handle) {
    CORE = None;
}

