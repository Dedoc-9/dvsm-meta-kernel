// ============================================================================
// 1. ABI STABILITY LAYER (OPAQUE HANDLE CONTRACT)
// ============================================================================

#[repr(C)]
pub struct DVSM_Handle {
    pub(crate) v_state: u32,
    pub(crate) beta: f32,
    pub(crate) epsilon: f32,
    pub(crate) u_max: f32,
}

// ============================================================================
// 2. CROSS-PLATFORM SIMD + SCALAR FALLBACK ENGINE
// ============================================================================

pub struct DVSM_Math;

impl DVSM_Math {

    #[inline(always)]
    pub unsafe fn residue_simd(a: *const f32, b: *const f32, len: usize) -> f32 {

        #[cfg(target_arch = "x86_64")]
        {
            use std::arch::x86_64::*;

            let mut sum = _mm_setzero_ps();
            let mut i = 0;

            while i + 4 <= len {
                let va = _mm_loadu_ps(a.add(i));
                let vb = _mm_loadu_ps(b.add(i));
                let diff = _mm_sub_ps(va, vb);
                sum = _mm_add_ps(sum, _mm_mul_ps(diff, diff));
                i += 4;
            }

            let mut out = [0.0f32; 4];
            _mm_storeu_ps(out.as_mut_ptr(), sum);

            let mut total = out.iter().sum::<f32>();

            while i < len {
                let d = *a.add(i) - *b.add(i);
                total += d * d;
                i += 1;
            }

            total.sqrt()
        }

        #[cfg(target_arch = "aarch64")]
        {
            use std::arch::aarch64::*;

            let mut sum = vdupq_n_f32(0.0);
            let mut i = 0;

            while i + 4 <= len {
                let va = vld1q_f32(a.add(i));
                let vb = vld1q_f32(b.add(i));
                let diff = vsubq_f32(va, vb);
                sum = vaddq_f32(sum, vmulq_f32(diff, diff));
                i += 4;
            }

            let mut total = vaddvq_f32(sum);

            while i < len {
                let d = *a.add(i) - *b.add(i);
                total += d * d;
                i += 1;
            }

            total.sqrt()
        }

        #[cfg(not(any(target_arch = "x86_64", target_arch = "aarch64")))]
        {
            let mut total = 0.0f32;
            for i in 0..len {
                let d = *a.add(i) - *b.add(i);
                total += d * d;
            }
            total.sqrt()
        }
    }

    // ------------------------------------------------------------
    // Ghost scalar projection (DLSS-style confidence kernel)
    // ------------------------------------------------------------
    #[inline(always)]
    pub fn ghost(overlap: f32, residue: f32) -> f32 {
        overlap * residue
    }

    // ------------------------------------------------------------
    // Viability gate (frame acceptance filter)
    // ------------------------------------------------------------
    #[inline(always)]
    pub fn gate(g: f32, beta: f32, epsilon: f32, u_max: f32, z_norm: f32) -> bool {
        (g * beta > epsilon) && (z_norm < u_max)
    }
}

// ============================================================================
// 3. SAFE STATE EVOLUTION (CAUSAL ONLY)
// ============================================================================

#[inline(always)]
fn evolve(v: u32, sigma: u32) -> u32 {
    let drift = sigma.wrapping_mul(1664525) ^ (v >> 3);
    v.wrapping_add(drift).wrapping_mul(1103515245)
}

// ============================================================================
// 4. PANIC-SEALED C ABI SURFACE (INDUSTRIAL SAFE MODE)
// ============================================================================

#[no_mangle]
pub extern "C" fn dvsm_step(handle: *mut DVSM_Handle, sigma: c_uint) -> c_uint {

    let result = catch_unwind(|| unsafe {
        if handle.is_null() {
            return 1;
        }

        let h = &mut *handle;
        h.v_state = evolve(h.v_state, sigma);
        0
    });

    result.unwrap_or(2) // panic-safe ABI return
}

// ============================================================================

#[no_mangle]
pub extern "C" fn dvsm_residue(
    a: *const c_float,
    b: *const c_float,
    len: c_uint
) -> c_float {

    let result = catch_unwind(|| unsafe {
        if a.is_null() || b.is_null() || len == 0 {
            return 0.0;
        }

        DVSM_Math::residue_simd(a, b, len as usize)
    });

    result.unwrap_or(0.0)
}

// ============================================================================

#[no_mangle]
pub extern "C" fn dvsm_gate(
    ghost: c_float,
    beta: c_float,
    epsilon: c_float,
    u_max: c_float,
    z_norm: c_float
) -> c_uint {

    DVSM_Math::gate(ghost, beta, epsilon, u_max, z_norm) as c_uint
}

