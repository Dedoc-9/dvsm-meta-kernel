/// --------------------------------------------------------------------------
/// COMPUTE RESIDUE CONTRACT
/// --------------------------------------------------------------------------
///
/// Residue definition:
///   R_t = || Z_t - S_t ||
///
/// Interpretation:
///   - Z_t = forward spectral field (current frame hypothesis)
///   - S_t = temporal memory buffer (history accumulation)
///   - R_t = non-normal energy leftover after projection mismatch
///
/// GPU mapping:
///   R_t is written into:
///     - motion vectors buffer (aux channel)
///     - temporal accumulation buffer (history ping-pong)
///     - variance / uncertainty buffer (DLSS-like confidence field)
///
pub struct ComputeResidueContract;

impl ComputeResidueContract {

    /// Scalar form (CPU-side fallback / debug path)
    #[inline(always)]
    pub fn residue_scalar(z: &[f32], s: &[f32]) -> f32 {
        let mut acc = 0.0f32;

        let len = z.len().min(s.len());
        let mut i = 0;

        while i < len {
            let d = z[i] - s[i];
            acc += d * d;
            i += 1;
        }

        acc.sqrt()
    }

    /// GPU binding semantics (conceptual only)
    ///
    /// NOTE:
    /// This does NOT execute on CPU.
    /// It defines how compute shaders MUST interpret buffers.
    pub fn gpu_binding_contract() -> &'static str {
        r#"
        layout(set = 0, binding = 0) buffer Z_t { float z[]; };
        layout(set = 0, binding = 1) buffer S_t { float s[]; };
        layout(set = 0, binding = 2) buffer R_t { float r[]; };

        r[i] = sqrt((z[i] - s[i]) * (z[i] - s[i]));
        "#
    }

    /// DLSS / temporal upscaling adapter rule:
    ///
    /// Residue controls reconstruction confidence:
    ///   high R_t → low reuse of history
    ///   low R_t  → strong temporal accumulation
    #[inline(always)]
    pub fn temporal_confidence(residue: f32) -> f32 {
        1.0 / (1.0 + residue)
    }
}

